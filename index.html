<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f7fb;
    --surface:#ffffff;
    --surface-2:#f1f3f9;
    --border:#e6e8f0;
    --text:#0f172a;
    --text-muted:#64748b;
    --accent:#4f46e5;
    --accent-soft:#eef2ff;
    --danger:#dc2626;
    --success:#16a34a;
    --warning:#d97706;
    --radius:16px;
    --radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.06);
    --shadow-md:0 4px 12px rgba(15,23,42,.06), 0 2px 4px rgba(15,23,42,.04);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1400px;margin:0 auto;padding:32px 28px 64px}
  header.page-head{margin-bottom:24px}
  .page-head h1{font-size:28px;font-weight:800;letter-spacing:-0.02em;margin:0 0 6px}
  .page-head p{margin:0;color:var(--text-muted);font-size:14px}

  .toolbar{
    position:sticky;top:0;z-index:20;
    background:var(--bg);
    padding:14px 0 12px;
    margin-bottom:20px;
    border-bottom:1px solid var(--border);
    display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
  }
  .tabs{display:flex;flex-wrap:wrap;gap:8px}
  .tab{
    padding:9px 16px;border-radius:999px;background:var(--surface);
    border:1px solid var(--border);cursor:pointer;font-weight:500;font-size:13px;
    color:var(--text);transition:all .15s ease;user-select:none;white-space:nowrap;
  }
  .tab:hover{background:var(--surface-2)}
  .tab.active{color:#fff;border-color:transparent;box-shadow:var(--shadow-sm)}
  .actions{display:flex;gap:8px;align-items:center}
  .btn{
    padding:9px 14px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-weight:500;font-size:13px;
    cursor:pointer;transition:all .15s ease;font-family:inherit;
  }
  .btn:hover{background:var(--surface-2)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.danger{color:var(--danger);border-color:#fecaca;background:#fff}
  .btn.danger:hover{background:#fef2f2}
  .saved-badge{font-size:12px;color:var(--success);opacity:0;transition:opacity .25s}

  .section-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:16px;
  }

  .activity-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px;
    box-shadow:var(--shadow-sm);
    transition:box-shadow .15s ease, transform .15s ease;
    display:flex;flex-direction:column;
  }
  .activity-card:hover{box-shadow:var(--shadow-md)}
  .card-header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .card-icon{
    width:40px;height:40px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);font-size:20px;flex-shrink:0;
  }
  .card-title{font-weight:700;font-size:15px;letter-spacing:-0.01em}
  .card-subtitle{font-size:12px;color:var(--text-muted);margin-top:2px}

  .metrics-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px;margin-bottom:14px}
  .metric{
    background:var(--surface-2);border-radius:var(--radius-sm);padding:10px 12px;
    display:flex;flex-direction:column;gap:4px;
  }
  .metric-label{font-size:11px;color:var(--text-muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
  .num-input{
    width:100%;border:none;background:transparent;font-size:18px;font-weight:700;
    font-family:inherit;color:var(--text);padding:0;-moz-appearance:textfield;
  }
  .num-input::-webkit-outer-spin-button,.num-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .num-input:focus{outline:none}

  .entry-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:8px}
  .entry-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
  .entry-item{
    display:flex;align-items:center;gap:8px;padding:8px 10px;
    background:var(--surface-2);border-radius:10px;border:1px solid transparent;
    transition:border-color .15s;
  }
  .entry-item:focus-within{border-color:var(--accent);background:#fff}
  .entry-item input[type=text]{
    flex:1;min-width:0;border:none;background:transparent;font-family:inherit;
    font-size:13px;color:var(--text);padding:2px 0;
  }
  .entry-item input[type=text]:focus{outline:none}

  .status-pill{
    font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;
    border:1px solid transparent;background:transparent;cursor:pointer;font-family:inherit;
    appearance:none;-webkit-appearance:none;padding-right:8px;
  }
  .status-pill.s-plan{background:#f1f5f9;color:#475569}
  .status-pill.s-progress{background:#fef3c7;color:#92400e}
  .status-pill.s-done{background:#dcfce7;color:#166534}

  .icon-btn{
    width:26px;height:26px;border-radius:8px;border:none;background:transparent;
    color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:all .15s;
  }
  .icon-btn:hover{background:#fff;color:var(--text)}
  .icon-btn.active{color:var(--accent)}
  .icon-btn.danger:hover{color:var(--danger);background:#fef2f2}

  .add-btn{
    background:transparent;border:1px dashed var(--border);color:var(--text-muted);
    padding:8px 12px;border-radius:10px;cursor:pointer;font-size:12px;font-weight:500;
    width:100%;font-family:inherit;transition:all .15s;
  }
  .add-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

  .notes-field{
    width:100%;min-height:56px;resize:vertical;
    border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:10px 12px;font-family:inherit;font-size:13px;color:var(--text);
    background:var(--surface);transition:border-color .15s;
  }
  .notes-field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .entry-section{margin-top:auto}

  #summaryBox{
    display:none;margin-top:20px;padding:20px;background:var(--surface);
    border:1px solid var(--border);border-radius:var(--radius);
    white-space:pre-wrap;font-family:'SF Mono',Menlo,monospace;font-size:12.5px;line-height:1.6;
    box-shadow:var(--shadow-sm);
  }

  @media (max-width:640px){
    .wrap{padding:20px 16px 48px}
    .page-head h1{font-size:22px}
    .toolbar{flex-direction:column;align-items:stretch}
    .actions{justify-content:flex-end}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="page-head">
    <h1>Marketing dashboard</h1>
    <p>Track activities and results across offerings</p>
  </header>

  <div class="toolbar">
    <div class="tabs" id="offeringsTabs"></div>
    <div class="actions">
      <span class="saved-badge" id="savedBadge">✓ saved</span>
      <button class="btn" onclick="exportReport()">Export summary ↗</button>
      <button class="btn danger" onclick="clearData()">Clear data</button>
    </div>
  </div>

  <div id="dashContent"></div>
  <div id="summaryBox"></div>
</div>

<script>
const OFFERINGS = [
  {id:'ai',    label:'Play: Integrations for aggregators', color:'#4f46e5'},
  {id:'cloud', label:'SC: Operational Visibility',          color:'#0d9488'},
  {id:'data',  label:'SC: Data Layer',                       color:'#ea580c'},
  {id:'qa',    label:'Game Reskins',                         color:'#7c3aed'},
];
const ACTIVITIES = [
  {id:'linkedin_organic', icon:'💼', title:'LinkedIn organic',   sub:'Posts featuring key experts',
   metrics:[{k:'posts',l:'Posts'},{k:'impressions',l:'Impressions'},{k:'engagements',l:'Engagements'}],
   entryLabel:'Post topics / links'},
  {id:'abm',              icon:'📧', title:'ABM campaigns',      sub:'Email sequences + LinkedIn DMs',
   metrics:[{k:'contacts',l:'Contacts'},{k:'opened',l:'Opened'},{k:'replies',l:'Replies'}],
   entryLabel:'ICP accounts targeted'},
  {id:'enablement',       icon:'📄', title:'Sales enablement',   sub:'Decks, case studies, one-pagers',
   metrics:[{k:'assets',l:'Created'},{k:'used',l:'Used by sales'}],
   entryLabel:'Asset names / types'},
  {id:'pr',               icon:'📰', title:'PR & media',         sub:'Mentions, interviews, bylines',
   metrics:[{k:'mentions',l:'Mentions'},{k:'reach',l:'Est. reach'}],
   entryLabel:'Publication / topic'},
];

const LS_KEY = 'mkt_dashboard_v2';
let currentOffering = 'ai';
let state = {};

const ICON_LINK = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>`;
const ICON_OPEN = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;
const ICON_X = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;

function saveState(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({state, currentOffering}));
    const b=document.getElementById('savedBadge');
    if(b){b.style.opacity='1';setTimeout(()=>b.style.opacity='0',1100);}
  }catch(e){}
}
function loadState(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){const s=JSON.parse(raw);state=s.state||{};currentOffering=s.currentOffering||'ai';}
  }catch(e){}
}
function clearData(){
  if(!confirm('Clear all dashboard data? This cannot be undone.'))return;
  localStorage.removeItem(LS_KEY);
  state={};currentOffering='ai';
  document.getElementById('summaryBox').style.display='none';
  renderTabs();renderContent();
}

function getState(offering, actId){
  state[offering]=state[offering]||{};
  state[offering][actId]=state[offering][actId]||{metrics:{},items:[],notes:''};
  return state[offering][actId];
}

function renderTabs(){
  const el=document.getElementById('offeringsTabs');
  el.innerHTML=OFFERINGS.map(o=>`<div class="tab${o.id===currentOffering?' active':''}" onclick="selectOffering('${o.id}')" style="${o.id===currentOffering?'background:'+o.color:''}">${o.label}</div>`).join('');
}
function selectOffering(id){
  currentOffering=id;
  document.getElementById('summaryBox').style.display='none';
  saveState();renderTabs();renderContent();
}

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function renderContent(){
  let html='<div class="section-grid">';
  ACTIVITIES.forEach(act=>{
    const s=getState(currentOffering,act.id);
    html+=`<div class="activity-card">
      <div class="card-header">
        <div class="card-icon">${act.icon}</div>
        <div><div class="card-title">${act.title}</div><div class="card-subtitle">${act.sub}</div></div>
      </div>
      <div class="metrics-row">`;
    act.metrics.forEach(m=>{
      const v=s.metrics[m.k]||0;
      html+=`<div class="metric">
        <div class="metric-label">${m.l}</div>
        <input class="num-input" type="number" min="0" value="${v}" onchange="setMetric('${currentOffering}','${act.id}','${m.k}',this.value)">
      </div>`;
    });
    html+=`</div>
      <div class="entry-section">
        <div class="entry-label">${act.entryLabel}</div>
        <div class="entry-list" id="list-${act.id}">`;
    (s.items||[]).forEach((item,i)=>{
      const hasLink=item.url&&item.url.trim()!=='';
      html+=`<div class="entry-item">
        <input type="text" value="${esc(item.text)}" placeholder="Add detail…" onchange="updateItem('${currentOffering}','${act.id}',${i},'text',this.value)">
        <select class="status-pill ${item.status||'s-plan'}" onchange="updateItem('${currentOffering}','${act.id}',${i},'status',this.value);renderContent()">
          <option value="s-plan"${(item.status||'s-plan')==='s-plan'?' selected':''}>Planned</option>
          <option value="s-progress"${item.status==='s-progress'?' selected':''}>In progress</option>
          <option value="s-done"${item.status==='s-done'?' selected':''}>Done</option>
        </select>
        <button class="icon-btn${hasLink?' active':''}" title="${hasLink?'Edit link':'Add link'}" onclick="promptLink('${currentOffering}','${act.id}',${i})">${ICON_LINK}</button>
        ${hasLink?`<a class="icon-btn" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer" title="Open link">${ICON_OPEN}</a>`:''}
        <button class="icon-btn danger" title="Remove" onclick="removeItem('${currentOffering}','${act.id}',${i})">${ICON_X}</button>
      </div>`;
    });
    html+=`</div>
        <button class="add-btn" onclick="addItem('${currentOffering}','${act.id}')">+ Add item</button>
      </div>
      <div class="entry-label" style="margin-top:14px">Notes</div>
      <textarea class="notes-field" placeholder="Notes, blockers, next steps…" onchange="setNotes('${currentOffering}','${act.id}',this.value)">${esc(s.notes)}</textarea>
    </div>`;
  });
  html+='</div>';
  document.getElementById('dashContent').innerHTML=html;
}

function promptLink(offering,actId,i){
  const current=getState(offering,actId).items[i].url||'';
  const val=prompt('Enter URL (leave blank to remove):',current);
  if(val===null)return;
  const t=val.trim();
  if(t&&!/^https?:\/\//i.test(t)){alert('URL must start with http:// or https://');return;}
  updateItem(offering,actId,i,'url',t);renderContent();
}
function setMetric(o,a,k,v){getState(o,a).metrics[k]=parseInt(v)||0;saveState();}
function setNotes(o,a,v){getState(o,a).notes=v;saveState();}
function addItem(o,a){getState(o,a).items.push({text:'',status:'s-plan',url:''});saveState();renderContent();}
function removeItem(o,a,i){getState(o,a).items.splice(i,1);saveState();renderContent();}
function updateItem(o,a,i,f,v){getState(o,a).items[i][f]=v;saveState();}

function exportReport(){
  const lines=[`MARKETING REPORT`,``,`Offering: ${OFFERINGS.find(o=>o.id===currentOffering).label}`,``];
  ACTIVITIES.forEach(act=>{
    const s=getState(currentOffering,act.id);
    const has=Object.values(s.metrics).some(v=>v>0)||(s.items&&s.items.length>0)||s.notes;
    if(!has)return;
    lines.push(`${act.icon} ${act.title.toUpperCase()}`);
    act.metrics.forEach(m=>{if(s.metrics[m.k])lines.push(`  ${m.l}: ${s.metrics[m.k]}`)});
    if(s.items&&s.items.length){
      s.items.forEach(it=>{
        const st=it.status==='s-done'?'[done]':it.status==='s-progress'?'[in progress]':'[planned]';
        if(it.text){lines.push(`  ${st} ${it.text}${it.url?` → ${it.url}`:''}`);}
      });
    }
    if(s.notes)lines.push(`  Notes: ${s.notes}`);
    lines.push(``);
  });
  const box=document.getElementById('summaryBox');
  box.textContent=lines.join('\n');
  box.style.display='block';
  box.scrollIntoView({behavior:'smooth'});
}

loadState();
renderTabs();
renderContent();
</script>
</body>
</html>
